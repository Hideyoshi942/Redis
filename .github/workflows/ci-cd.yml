name: CI/CD Redis

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

#env:
#  JAVA_VERSION: 17
#  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/my-spring-app
#  # Nếu dùng Docker Hub, thay IMAGE_NAME bằng dockerhub_user/repo

jobs:
  build_test:
    runs-on: ubuntu-latest
#    strategy:
#      matrix:
#        build-tool: [maven]  # or [gradle] nếu dùng Gradle
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

  publish-job:
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - run: mvn --batch-mode --update-snapshots verify
      - run: mkdir staging && cp target/*.jar staging
      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging

